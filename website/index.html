<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Studio RIZIへ</title>
  <style>
    :root{color-scheme:light dark;--background:#f5f6f0;--text:#151714;--accent:#b8ff2c;--shadow:#151714}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--background);color:var(--text);font-family:Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
    main{width:min(680px,100%);text-align:center}
    p{margin:0 0 clamp(34px,6vw,54px);font-size:clamp(28px,5.4vw,58px);font-weight:900;line-height:1.25;letter-spacing:-.045em;text-wrap:balance}
    a{display:inline-flex;min-width:min(320px,100%);min-height:62px;align-items:center;justify-content:space-between;gap:28px;padding:18px 24px;border:2px solid var(--text);background:var(--accent);color:#151714;box-shadow:7px 7px 0 var(--shadow);font-size:clamp(14px,2vw,18px);font-weight:900;text-decoration:none;transition:transform .18s ease,box-shadow .18s ease}
    a:hover{transform:translate(-2px,-2px);box-shadow:10px 10px 0 var(--shadow)}
    a:focus-visible{outline:4px solid #4c67ff;outline-offset:6px}
    @media(prefers-color-scheme:dark){:root{--background:#080a08;--text:#eef3e8;--shadow:#eef3e8}a{border-color:#eef3e8;box-shadow:7px 7px 0 #eef3e8}a:hover{box-shadow:10px 10px 0 #eef3e8}}
    @media(prefers-reduced-motion:reduce){a{transition:none}}
  </style>
</head>
<body>
  <main>
    <p id="message">折田悠希のサイトに移動しますか？</p>
    <a id="destination" href="https://studio-rizi.pages.dev/">移動する <span aria-hidden="true">→</span></a>
  </main>
  <script>
    const copy = {
      ja:{message:'折田悠希のサイトに移動しますか？',button:'移動する',title:'Studio RIZIへ'},
      en:{message:"Would you like to visit Yuki Orita's website?",button:'Visit website',title:'Go to Studio RIZI'},
      zh:{message:'要前往折田悠希的网站吗？',button:'前往网站',title:'前往 Studio RIZI'},
      pt:{message:'Deseja visitar o site de Yuki Orita?',button:'Visitar site',title:'Ir para o Studio RIZI'}
    };
    const preferred = navigator.languages?.length ? navigator.languages : [navigator.language || 'en'];
    const matched = preferred.map(value=>value.toLowerCase()).find(value=>Object.keys(copy).some(lang=>value===lang||value.startsWith(`${lang}-`)));
    const lang = matched ? Object.keys(copy).find(value=>matched===value||matched.startsWith(`${value}-`)) : 'en';
    document.documentElement.lang = lang;
    document.querySelector('#message').textContent = copy[lang].message;
    document.querySelector('#destination').childNodes[0].textContent = `${copy[lang].button} `;
    document.title = copy[lang].title;
  </script>
</body>
</html>
